<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harshit Abhinav · AI / ML Engineer</title>
    <meta name="description" content="Harshit Abhinav: AI / ML engineer and Computer Science graduate (GITAM, 2026, CGPA 8.33) building deep learning and computer vision models, plus the systems and web apps around them. Projects, skills, experience and resume." />
    <meta name="author" content="Harshit Abhinav" />
    <meta name="theme-color" content="#F8F5EE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TODO: after deploying, set your real URL in the three places below -->
    <link rel="canonical" href="https://harshit-abhinav.vercel.app/" />

    <!-- Open Graph: how the link previews on LinkedIn, WhatsApp, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harshit-abhinav.vercel.app/" />
    <meta property="og:title" content="Harshit Abhinav · AI / ML Engineer" />
    <meta property="og:description" content="Deep learning, computer vision and the software that ships it: a BiLSTM for jet engines, a 60 FPS distilled vision model, a RISC-V OS and more. See the projects, skills and resume." />
    <meta property="og:image" content="https://harshit-abhinav.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Harshit Abhinav, portrait with the text 'I build models, systems & the web'" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: fetched in parallel with the app so text doesn't jump when they arrive -->
    <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/caveat.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Load the hero photo early: it's the largest thing on first screen -->
    <link rel="preload" as="image" type="image/webp" href="/photos/hero-800.webp"
      imagesrcset="/photos/hero-480.webp 480w, /photos/hero-800.webp 800w, /photos/hero-1200.webp 1200w"
      imagesizes="(min-width: 1024px) 420px, 80vw" fetchpriority="high" />
    <!-- Apply a saved theme before the page paints (light is the default) -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b1020");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Harshit Abhinav, software engineer. Email gompaharshit7@gmail.com · github.com/abhi68402</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
